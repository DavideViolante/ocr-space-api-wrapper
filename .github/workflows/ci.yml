name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install deps
      run: npm ci
    - name: Run Lint
      run: npm run lint
    - name: Run Tests
      env:
        OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
      run: npm test